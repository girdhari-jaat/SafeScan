android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
android.enableR8.fullMode=true

# Disable incremental annotation processing to prevent wrapper regeneration
org.gradle.workers.max=4
android.enableOnDemandSourceGeneration=false
android.generateSourcesOnCompileClasspath=true

# Kotlin compiler settings
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.parallel.tasks.in.project=true

# Disable legacy incremental compilation for Hilt
org.gradle.unsafe.kotlin.incrementalCompilation.useClasspathSnapshot=false

# Optimize build caching and avoid unnecessary Java wrapper regeneration
org.gradle.caching=true
org.gradle.caching.debug=false
android.buildCacheDir=.gradle/buildCache

# Disable source generation on compile classpath
android.generateSourcesOnCompileClasspath=false
