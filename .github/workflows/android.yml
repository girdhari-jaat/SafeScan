name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          build-root-directory: android

      # YE STEP UPDATE KIYA HAI - QuickBird ki 5MB wali so
      - name: Download and setup OpenCV native library
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          wget https://github.com/QuickBirdEng/opencv-android/releases/download/4.5.5/opencv-android-4.5.5.aar
          unzip opencv-android-4.5.5.aar jni/arm64-v8a/libopencv_java4.so
          mv jni/arm64-v8a/libopencv_java4.so app/src/main/jniLibs/arm64-v8a/
          rm -rf opencv-android-4.5.5.aar jni

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

