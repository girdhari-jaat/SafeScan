name: Android Lint & Static Analysis

on:
  workflow_dispatch: # Allows manual trigger only

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Debug wrapper
        run: ls -l android/gradle/wrapper/gradle-wrapper.jar

      - name: Run Detekt
        run: cd android && ./gradlew detekt

      - name: Run Ktlint
        run: cd android && ./gradlew ktlintCheck
