name: Build Minimal OpenCV Android SDK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.opencv.yml'

jobs:
  build-opencv:
    runs-on: ubuntu-latest
    
    env:
      ANDROID_NDK_VERSION: 25.2.9519653
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      OPENCV_VERSION: 4.10.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Java 17
        uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set JAVA_HOME Env
        run: |
          echo "JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> $GITHUB_ENV
          echo "PATH=${{ steps.setup-java.outputs.path }}/bin:$PATH" >> $GITHUB_ENV

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "cmake;3.22.1" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ant

      - name: Download OpenCV Source
        run: |
          wget -q https://github.com/opencv/opencv/archive/refs/tags/${OPENCV_VERSION}.zip -O ${OPENCV_VERSION}.zip
          unzip -q ${OPENCV_VERSION}.zip
          mv opencv-${OPENCV_VERSION} opencv

      - name: Remove Unused Camera Views (Avoids Videoio dependency)
        run: |
          # Use find to guarantee all camera/video references are deleted regardless of exact path
          find opencv -name "NativeCameraView.java" -delete
          find opencv -name "JavaCameraView.java" -delete
          find opencv -name "JavaCamera2View.java" -delete
          find opencv -name "CameraBridgeViewBase.java" -delete
          find opencv -name "CameraGLSurfaceView.java" -delete
          find opencv -name "CameraGLRendererBase.java" -delete
          find opencv -name "Camera2Renderer.java" -delete
          find opencv -name "CameraRenderer.java" -delete
          find opencv -name "CameraActivity.java" -delete
          find opencv -name "FpsMeter.java" -delete
          echo "Camera views and renderers deleted successfully!"

      - name: Configure CMake
        run: |
          cmake -S opencv -B build \
            -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT -DANDROID_SDK=$ANDROID_SDK_ROOT -DANDROID_NDK=$ANDROID_NDK_ROOT \
            -DANT_EXECUTABLE=/usr/bin/ant \
            -DJava_JAVA_EXECUTABLE=$JAVA_HOME/bin/java \
            -DJava_JAVAC_EXECUTABLE=$JAVA_HOME/bin/javac \
            -DJava_JAR_EXECUTABLE=$JAVA_HOME/bin/jar \
            -DJAVA_AWT_LIBRARY=NotNeeded \
            -DJAVA_JVM_LIBRARY=NotNeeded \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_FAT_JAVA_LIB=ON -DBUILD_LIST=core,imgproc,imgcodecs,java \
            -DBUILD_JAVA=ON -DBUILD_opencv_java=ON -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_ANDROID_EXAMPLES=OFF -DBUILD_ANDROID_PROJECTS=ON \
            -DANDROID_STL=c++_shared -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DWITH_JPEG=ON -DWITH_PNG=ON -DWITH_TIFF=OFF -DWITH_WEBP=OFF \
            -DWITH_OPENEXR=OFF -DWITH_JASPER=OFF -DWITH_OPENJPEG=OFF -DWITH_IPP=OFF \
            -DWITH_TBB=OFF -DWITH_ADE=OFF -DWITH_EIGEN=OFF -DWITH_OPENCL=OFF \
            -DBUILD_ZLIB=ON -DBUILD_opencv_apps=OFF -DBUILD_ANDROID_SERVICE=OFF \
            -DBUILD_DOCS=OFF -DBUILD_PACKAGE=OFF -DBUILD_WITH_DEBUG_INFO=OFF \
            -DCMAKE_C_FLAGS="-g0 -Os -fvisibility=hidden -fdata-sections -ffunction-sections" \
            -DCMAKE_CXX_FLAGS="-g0 -Os -fvisibility=hidden -fvisibility-inlines-hidden -fdata-sections -ffunction-sections" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections -Wl,--strip-all -s -Wl,--exclude-libs,ALL"

      - name: Build OpenCV
        run: cmake --build build --parallel $(nproc)

      - name: Prepare Artifacts and Strip Debug Symbols
        run: |
          mkdir -p dist_opencv/arm64-v8a
          
          # Find and copy the compiled .so file
          SO_FILE=$(find build -name "libopencv_java4.so" | head -n 1)
          if [ -n "$SO_FILE" ]; then
            echo "Found compiled library at: $SO_FILE"
            cp "$SO_FILE" dist_opencv/arm64-v8a/
          else
            echo "Error: libopencv_java4.so not found!"
            exit 1
          fi
          
          # Find and copy the compiled jar/aar file
          echo "Searching for jar or aar files..."
          find build -type f \( -name "*.jar" -o -name "*.aar" \) -exec cp {} dist_opencv/ \;
          echo "Contents of dist_opencv:"
          ls -la dist_opencv/
          
          # Strip debug symbols using NDK llvm-strip toolchain to minimize size
          SO_FILES=$(find dist_opencv -name "*.so")
          if [ -z "$SO_FILES" ]; then
            echo "No .so files found to strip!"
          else
            echo "Found .so files to strip: $SO_FILES"
            STRIP_TOOL=$(find "$ANDROID_NDK_ROOT" -name "llvm-strip" | head -n 1)
            if [ -n "$STRIP_TOOL" ]; then
              echo "Stripping debug symbols using NDK llvm-strip: $STRIP_TOOL"
              for f in $SO_FILES; do
                "$STRIP_TOOL" --strip-all "$f"
              done
            else
              echo "Fallback: trying standard strip..."
              for f in $SO_FILES; do
                strip --strip-all "$f" || true
              done
            fi
          fi

      - name: Upload OpenCV Files
        uses: actions/upload-artifact@v4
        with:
          name: opencv-4.10.0-arm64-v8a-java
          path: |
            dist_opencv/arm64-v8a/libopencv_java4.so
            dist_opencv/*.jar
            dist_opencv/*.aar
          if-no-files-found: error
