name: Build OpenCV Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/26.3.11579264

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: sudo apt update && sudo apt install -y ninja-build zip unzip wget ant

      - name: Set Java 17
        uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set JAVA_HOME Env
        run: |
          echo "JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> $GITHUB_ENV
          echo "PATH=${{ steps.setup-java.outputs.path }}/bin:$PATH" >> $GITHUB_ENV

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fix DNS
        run: |
          echo "140.82.114.4 github.com" | sudo tee -a /etc/hosts
          echo "185.199.108.133 github.com" | sudo tee -a /etc/hosts

      - name: Download OpenCV Source 4.10.0
        run: |
          wget https://github.com/opencv/opencv/archive/refs/tags/4.10.0.zip
          unzip 4.10.0.zip
          mv opencv-4.10.0 opencv

      - name: Remove Unused Camera Views (Avoids Videoio dependency)
        run: |
          # Find and delete camera views that depend on Videoio and aren't needed for document scanning
          find opencv -name "NativeCameraView.java" -delete
          find opencv -name "JavaCameraView.java" -delete
          find opencv -name "JavaCamera2View.java" -delete
          find opencv -name "CameraBridgeViewBase.java" -delete
          find opencv -name "CameraGLSurfaceView.java" -delete
          find opencv -name "CameraGLRendererBase.java" -delete
          find opencv -name "FpsMeter.java" -delete
          echo "Camera views deleted successfully to build clean lightweight SDK without videoio!"

      - name: Configure CMake
        run: |
          cmake -S opencv -B build \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT -DANDROID_SDK=$ANDROID_SDK_ROOT -DANDROID_NDK=$ANDROID_NDK_ROOT \
            -DANT_EXECUTABLE=/usr/bin/ant \
            -DJava_JAVA_EXECUTABLE=$JAVA_HOME/bin/java \
            -DJava_JAVAC_EXECUTABLE=$JAVA_HOME/bin/javac \
            -DJava_JAR_EXECUTABLE=$JAVA_HOME/bin/jar \
            -DJAVA_AWT_LIBRARY=NotNeeded \
            -DJAVA_JVM_LIBRARY=NotNeeded \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_FAT_JAVA_LIB=ON -DBUILD_LIST=core,imgproc,imgcodecs,java \
            -DBUILD_JAVA=ON -DBUILD_opencv_java=ON -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_ANDROID_EXAMPLES=OFF -DBUILD_ANDROID_PROJECTS=ON \
            -DANDROID_STL=c++_shared -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DWITH_JPEG=OFF -DWITH_PNG=OFF -DWITH_TIFF=OFF -DWITH_WEBP=OFF \
            -DWITH_OPENEXR=OFF -DWITH_JASPER=OFF -DWITH_OPENJPEG=OFF -DWITH_IPP=OFF \
            -DWITH_TBB=OFF -DWITH_ADE=OFF -DWITH_EIGEN=OFF -DWITH_OPENCL=OFF \
            -DBUILD_ZLIB=ON -DBUILD_opencv_apps=OFF -DBUILD_ANDROID_SERVICE=OFF \
            -DBUILD_DOCS=OFF -DBUILD_PACKAGE=OFF \
            -DCMAKE_C_FLAGS="-g0 -Os -fvisibility=hidden -fdata-sections -ffunction-sections -DNDEBUG" \
            -DCMAKE_CXX_FLAGS="-g0 -Os -fvisibility=hidden -fvisibility-inlines-hidden -fdata-sections -ffunction-sections -DNDEBUG" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections -Wl,--strip-all -Wl,--exclude-libs,ALL"

      - name: Build OpenCV
        run: cmake --build build --parallel $(nproc)

      - name: Prepare and Strip Release Library
        run: |
          mkdir -p dist_opencv/arm64-v8a
          # Find the compiled libopencv_java4.so file in the build directory
          SO_FILE=$(find build -name "libopencv_java4.so" | head -n 1)
          if [ -z "$SO_FILE" ]; then
            SO_FILE=$(find build -name "libopencv_java*.so" | head -n 1)
          fi
          if [ -z "$SO_FILE" ]; then
            echo "Error: libopencv_java4.so not found!"
            exit 1
          fi
          echo "Found compiled library at: $SO_FILE"
          cp "$SO_FILE" dist_opencv/arm64-v8a/
          
          # Find and copy the compiled jar file
          JAR_FILE=$(find build -name "opencv-*.jar" | head -n 1)
          if [ -n "$JAR_FILE" ]; then
            echo "Found compiled jar at: $JAR_FILE"
            cp "$JAR_FILE" dist_opencv/
          else
            echo "Warning: opencv-*.jar not found!"
          fi
          
          # Strip debug symbols using NDK llvm-strip toolchain to minimize size
          SO_FILES=$(find dist_opencv -name "*.so")
          if [ -z "$SO_FILES" ]; then
            echo "No .so files found to strip!"
          else
            echo "Found .so files to strip: $SO_FILES"
            STRIP_TOOL="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
            if [ -f "$STRIP_TOOL" ]; then
              echo "Stripping debug symbols using NDK llvm-strip: $STRIP_TOOL"
              for f in $SO_FILES; do
                "$STRIP_TOOL" --strip-all "$f"
              done
            else
              echo "NDK llvm-strip not found at $STRIP_TOOL, searching NDK directory..."
              NDK_STRIP=$(find "$ANDROID_NDK_ROOT" -name "llvm-strip" | head -n 1)
              if [ -n "$NDK_STRIP" ]; then
                echo "Found llvm-strip at: $NDK_STRIP"
                for f in $SO_FILES; do
                  "$NDK_STRIP" --strip-all "$f"
                done
              else
                echo "Fallback: trying standard strip..."
                for f in $SO_FILES; do
                  strip --strip-all "$f" || true
                done
              fi
            fi
          fi

      - name: Upload OpenCV Files
        uses: actions/upload-artifact@v4
        with:
          name: opencv-4.10.0-arm64-v8a-java
          path: |
            dist_opencv/arm64-v8a/libopencv_java4.so
            dist_opencv/opencv-*.jar
          if-no-files-found: error
